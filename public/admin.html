<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración · Agenda de la Experiencia</title><link rel="stylesheet" href="/styles.css"></head><body><main class="shell wide"><section class="card"><p class="eyebrow">ADMINISTRACIÓN</p><h1>Agenda de la Experiencia</h1><p>Panel de gestión. El contenido privado de los usuarios no se muestra aquí.</p><button id="logout" class="secondary">Cerrar sesión</button></section><section class="grid"><div class="card"><h2>Resumen</h2><div id="stats"></div></div><div class="card"><h2>Crear edición</h2><form id="edition" class="form"><label>Nombre<input name="name" placeholder="Edición 2027" required></label><button>Crear edición</button></form></div><div class="card"><h2>Generar códigos</h2><form id="batch" class="form"><label>Edición<select name="editionId" id="editionSelect" required></select></label><label>Cantidad<input name="count" type="number" min="1" max="5000" value="20" required></label><button>Generar lote</button></form><p id="codes" class="small"></p></div><div class="card"><h2>Tarjetas para impresión</h2><form id="cards" class="form"><label>Edición<select name="editionId" class="editionSelect" required></select></label><label>Cantidad<input name="limit" type="number" min="1" max="5000" value="20" required></label><button>Generar PDF</button></form></div><div class="card"><h2>QR general</h2><p>El mismo QR conduce a <code>/acceso</code>.</p><button id="qr">Generar QR</button><div id="qrbox"></div></div><div class="card"><h2>Usuarios</h2><div id="users"></div></div></section></main><script>
const $=s=>document.querySelector(s);async function api(u,o={}){const r=await fetch(u,{credentials:'include',headers:{'Content-Type':'application/json'},...o});if(r.status===401||r.status===403){location.href='/acceso';throw Error('No autorizado')}const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Error');return d;}
let dashboard;async function load(){dashboard=await api('/api/admin/dashboard');$('#stats').innerHTML=`<div class="metrics"><b>${dashboard.users}<small>usuarios</small></b><b>${dashboard.activated}<small>activadas</small></b><b>${dashboard.unused}<small>disponibles</small></b></div>`;const opts=dashboard.editions.map(e=>`<option value="${e.id}">${e.name}</option>`).join('');$('#editionSelect').innerHTML=opts;document.querySelectorAll('.editionSelect').forEach(x=>x.innerHTML=opts);const u=await api('/api/admin/users');$('#users').innerHTML=u.users.map(x=>`<div class="user"><span>${x.email}</span><small>${x.active?'activa':'inactiva'}</small></div>`).join('')||'<p class="muted">Sin usuarios.</p>';}
$('#edition').onsubmit=async e=>{e.preventDefault();try{const f=new FormData(e.target);await api('/api/admin/bootstrap-edition',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});e.target.reset();load();}catch(x){alert(x.message)}};
$('#batch').onsubmit=async e=>{e.preventDefault();try{const f=new FormData(e.target);const d=await api('/api/admin/activation-batch',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});$('#codes').textContent='Códigos creados: '+d.codes.join(', ');}catch(x){alert(x.message)}};
$('#cards').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const r=await fetch('/api/admin/cards.pdf',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});if(!r.ok){alert((await r.json()).error||'Error');return}const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='tarjetas-activacion.pdf';a.click();URL.revokeObjectURL(a.href)};
$('#qr').onclick=async()=>{try{const d=await api('/api/admin/qr',{method:'POST'});$('#qrbox').innerHTML=`<img src="${d.dataUrl}" alt="QR general"><p><code>${d.url}</code></p>`}catch(x){alert(x.message)}};
$('#logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});location.href='/acceso'};load().catch(()=>location.href='/acceso');
</script></body></html>
